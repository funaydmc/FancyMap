name: FancyMap
version: '${version}'

main: dev.funayd.fancyMap.FancyMap
api-version: '1.21.11'
load: POSTWORLD
depend:
  - packetevents
softdepend:
  - PlaceholderAPI
commands:
  fancymap:
    description: Khóa/mở góc nhìn và hiển thị bản đồ client-side
    usage: /fancymap [debug|config <config_key> <config_value>]
    aliases:
      - fm
      - map
permissions:
  fancymap.use:
    description: Open and control the FancyMap overlay
    default: true
  fancymap.debug:
    description: Toggle FancyMap debug output
    default: op
  fancymap.config:
    description: Change FancyMap runtime configuration
    default: op
  fancymap.reload:
    description: Reload FancyMap configuration and textures
    default: op
  fancymap.waypoint.list:
    description: Open the FancyMap waypoint list
    default: true
  fancymap.waypoint.teleport:
    description: Teleport to FancyMap waypoints
    default: op
  fancymap.waypoint.manage:
    description: Create, remove and configure FancyMap waypoints
    default: op
  fancymap.admin:
    description: Grant all FancyMap administrative permissions
    default: op
    children:
      fancymap.use: true
      fancymap.debug: true
      fancymap.config: true
      fancymap.reload: true
      fancymap.waypoint.list: true
      fancymap.waypoint.teleport: true
      fancymap.waypoint.manage: true
